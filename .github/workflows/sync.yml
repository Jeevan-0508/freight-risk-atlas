name: Sync risk model

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync taxonomy
        run: python scripts/sync_taxonomy.py
      - name: Commit if the risk model changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add data/taxonomy.json docs/taxonomy.json
            git commit -m 'Sync risk model from freight-fraud-taxonomy'
            git push
          else
            echo 'Risk model already up to date.'
          fi
