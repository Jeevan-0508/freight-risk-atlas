name: Sync risk model

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Sync taxonomy
        run: python scripts/sync_taxonomy.py
      - name: Propose taxonomy update for human review
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/taxonomy-sync
          delete-branch: true
          add-paths: |
            data/taxonomy.json
            docs/taxonomy.json
          commit-message: 'Sync risk model from freight-fraud-taxonomy'
          title: 'Review upstream freight fraud taxonomy update'
          body: |
            This pull request updates Atlas's local taxonomy copy from the upstream repository.

            The sync script checks structure and required fields. It does not validate empirical prevalence, severity, or the evidentiary basis for individual indicators.

            Please review the source version and complete diff before merging. No taxonomy update is promoted automatically.
