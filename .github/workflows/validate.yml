name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Risk model passes the same checks used on sync
        run: python scripts/sync_taxonomy.py data/taxonomy.json
      - name: Site copy matches the source of truth
        run: |
          python - <<'EOF'
          import json, sys
          a = json.load(open('data/taxonomy.json', encoding='utf-8'))
          b = json.load(open('docs/taxonomy.json', encoding='utf-8'))
          if a != b:
              sys.exit('docs/taxonomy.json is out of sync with data/taxonomy.json - run scripts/sync_taxonomy.py')
          print('in sync')
          EOF
      - name: App parses
        run: node -e "new Function(require('fs').readFileSync('docs/app.js','utf8'))"
